name: 10-Min Pexels Image Fetcher

on:
  schedule:
    - cron: '*/10 * * * *'  # প্রতি ১০ মিনিট পর পর রান হবে
  workflow_dispatch:      # ম্যানুয়ালি রান বা টেস্ট করার জন্য

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch image
        run: python fetch_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add images/
          git commit -m "Auto-fetch new Pexels image every 10 mins [skip ci]" || echo "No changes to commit"
          git push
